name: Build GROM RUSSIA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p grom/app/src/main/java/ru/gromrussia/launcher
          mkdir -p grom/app/src/main/res/values

          cat > grom/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "GromRussiaLauncher"
          include(":app")
          EOF

          cat > grom/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF

          cat > grom/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > grom/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "ru.gromrussia.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "ru.gromrussia.launcher"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0.0"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
          }
          EOF

          cat > grom/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="Theme.GromRussia" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:statusBarColor">#080808</item>
                  <item name="android:navigationBarColor">#080808</item>
              </style>
          </resources>
          EOF

name: Build GROM RUSSIA APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          mkdir -p grom/app/src/main/java/com/gromrussia/launcher
          mkdir -p grom/app/src/main/res/values

          cat > grom/settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "GROM-RUSSIA"
          include(":app")
          EOF

          cat > grom/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > grom/gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          kotlin.code.style=official
          EOF

          cat > grom/app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.gromrussia.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.gromrussia.launcher"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.15.0")
              implementation("androidx.activity:activity-compose:1.10.1")
              implementation(platform("androidx.compose:compose-bom:2025.01.00"))
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
          }
          EOF

          cat > grom/app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:font) -> Unit
          ) {
              Column(Modifier.fillMaxSize().padding(pad)) {
                  Header()
                  LazyColumn(
                      modifier = Modifier.padding(horizontal = 16.dp),
                      verticalArrangement = Arrangement.spacedBy(10.dp)
                  ) {
                      items(servers.indices.toList()) { i ->
                          Card(
                              onClick = { choose(i) },
                              modifier = Modifier.fillMaxWidth()
                          ) {
                              Row(
                                  Modifier.fillMaxWidth().padding(16.dp),
                                  verticalAlignment = Alignment.CenterVertically
                              ) {
                                  Column(Modifier.weight(1f)) {
                                      Text(servers[i].name, fontWeight = FontWeight.Bold)
                                      Text("${servers[i].online}/${servers[i].max} игроков")
                                  }
                                  Text(servers[i].status, color = Color(0xFFE53935))
                              }
                          }
                      }
                  }
              }
          }

          @Composable
          fun Settings(pad: PaddingValues) {
              Column(Modifier.fillMaxSize().padding(pad).padding(16.dp)) {
                  Header()
                  Text("Настройки", fontSize = 24.sp, fontWeight = FontWeight.Bold)
                  Spacer(Modifier.height(12.dp))
                  ListItem(
                      headlineContent = { Text("Язык") },
                      supportingContent = { Text("Русский") }
                  )
                  ListItem(
                      headlineContent = { Text("Версия лаунчера") },
                      supportingContent = { Text("1.0.0") }
                  )
                  ListItem(
                      headlineContent = { Text("Проверка файлов") },
                      supportingContent = { Text("Проверить целостность игры") }
                  )
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Build APK
        working-directory: grom
        run: gradle assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GROM-RUSSIA-APK
          path: grom/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
